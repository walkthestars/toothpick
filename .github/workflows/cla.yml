name: CLA Assistant

# Enforces the Contributor License Agreement (CLA.md) on pull requests.
# DCO has its own workflow (dco.yml); the two are complementary: DCO certifies
# origin per commit, the CLA grants the Project Owner relicensing rights per
# contributor.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 (repo archived)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/walkthestars/toothpick/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'walkthestars,bot*,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: 'Thanks for this pull request! Before it can be reviewed, first-time contributors need to accept the Toothpick Contributor License Agreement once (it covers all present and future contributions). Read it here: $pathToCLADocument

Then comment the exact phrase below on this pull request to sign:

`I have read the CLA Document and I hereby sign the CLA`'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: true
          suggest-recheck: false
